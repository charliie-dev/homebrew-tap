name: Autobump

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  livecheck:
    runs-on: ubuntu-latest
    outputs:
      casks: ${{ steps.outdated.outputs.casks }}
      has-updates: ${{ steps.outdated.outputs.has-updates }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find outdated casks
        id: outdated
        env:
          TAP: ${{ github.repository }}
        run: |
          updates="$(brew livecheck --tap "$TAP" --cask --newer-only --json --quiet)"
          casks="$(jq -c '[.[] | { cask: .cask, version: .version.latest }]' <<<"$updates")"

          echo "casks=$casks" >> "$GITHUB_OUTPUT"
          if [ "$casks" = "[]" ]; then
            echo "has-updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-updates=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: livecheck
    if: needs.livecheck.outputs.has-updates == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        update: ${{ fromJSON(needs.livecheck.outputs.casks) }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        run: brew install-bundler-gems

      - name: Configure Git
        uses: Homebrew/actions/git-user-config@main

      - name: Open update pull request
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew bump-cask-pr \
            --no-browse \
            --no-fork \
            --version "${{ matrix.update.version }}" \
            "${{ github.repository }}/${{ matrix.update.cask }}"
